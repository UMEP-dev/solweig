name: Test

on:
  push:
    branches:
      - main
      - dev
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - main
      - dev
  workflow_call: # Allow publish workflow to call this as a dependency

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff check
        run: uv run ruff check

      - name: Run ruff format check
        run: uv run ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ty
        run: uv run ty check pysrc/ tests/ demos/ scripts/ qgis_plugin/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # All jobs build the same crate the same way; share one cache.
          shared-key: maturin-develop
          workspaces: rust

      - name: Install dependencies
        run: uv sync --group test

      - name: Build Rust extension
        run: uv run maturin develop --release

      - name: Run tests (excluding slow)
        run: uv run python -m pytest tests/ -m 'not slow' -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  test-other-os:
    name: Test on ${{ matrix.os }} (informational)
    # The wheels are published for macOS and Windows, but every other job
    # runs on Linux. This job runs the fast suite on the other two. It does
    # not block yet (added 2026-11): make it required once it has been green
    # for a few releases. The hosted runners have no usable GPU, so the CPU
    # path is forced to keep the result independent of the runner image.
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install dependencies
        run: uv sync --group test

      - name: Build Rust extension
        run: uv run maturin develop --release

      - name: Run tests (excluding slow)
        run: uv run python -m pytest tests/ -m "not slow" -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
          SOLWEIG_NO_GPU: "1"

  rust-tests:
    name: Rust unit tests
    # On macOS because the crate enables pyo3's `extension-module`, which
    # leaves the Python symbols unresolved: a test binary links there
    # (dynamic lookup) and fails to link on Linux.
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run cargo test
        run: cargo test --manifest-path rust/Cargo.toml --lib

      - name: Check the CPU-only build without warnings
        # Other Rust projects depend on the crate with default-features = false.
        run: cargo check --manifest-path rust/Cargo.toml --no-default-features
        env:
          RUSTFLAGS: "-D warnings"

  test-qgis-compat:
    name: Test QGIS compatibility (GDAL backend, QGIS 4 series)
    # Ubuntu 26.04 carries GDAL 3.12 and NumPy 2.3 as system packages, the
    # same series as QGIS 4.2 (its macOS bundle has GDAL 3.12.4 and NumPy
    # 2.5). The plugin requires QGIS 4, so this is the combination to test.
    # Up to 2026-11 the job tested NumPy 1.26 with an older GDAL, from the
    # QGIS 3 days. Pinned by name so that a later change of ubuntu-latest
    # does not move the versions without anyone deciding it.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install GDAL with its Python bindings (prebuilt)
        # The distribution's ready-built bindings, as QGIS on Linux uses them.
        # Up to 2026-11 this job installed libgdal-dev (several hundred
        # packages) and compiled the bindings from source on every run.
        # The old install also failed outright when the Ubuntu mirrors were
        # slow (26 minutes, then exit 100, on 2026-11-11), hence the retries.
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends python3-gdal python3-numpy

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # All jobs build the same crate the same way; share one cache.
          shared-key: maturin-develop
          workspaces: rust

      - name: Create an environment on the system Python that sees the system GDAL
        # NumPy is pinned to the system's version: a newer NumPy inside the
        # environment would shadow it and break the system GDAL bindings.
        run: |
          uv venv --python /usr/bin/python3 --system-site-packages .venv
          NUMPY_VERSION=$(/usr/bin/python3 -c "import numpy; print(numpy.__version__)")
          uv pip install --python .venv/bin/python "numpy==${NUMPY_VERSION}" pytest maturin \
            "pyproj>=3.7.0" "shapely>=2.0.4" "rasterio>=1.3.0" "tqdm>=4.67.1" "pillow>=9.0.0"

      - name: Build Rust extension
        run: |
          source .venv/bin/activate
          maturin develop --release

      - name: Verify the versions under test and the GDAL backend
        # Fails if the image stops providing the QGIS 4 series, so the job
        # cannot drift to other versions unnoticed.
        run: |
          .venv/bin/python - <<'EOF'
          import sys
          import numpy
          from osgeo import gdal
          from solweig import io
          print("Python", sys.version.split()[0], "| NumPy", numpy.__version__, "| GDAL", gdal.__version__)
          assert io.GDAL_ENV, "expected the GDAL backend"
          assert int(numpy.__version__.split(".")[0]) >= 2, f"expected NumPy 2.x, got {numpy.__version__}"
          major, minor = (int(part) for part in gdal.__version__.split(".")[:2])
          assert (major, minor) >= (3, 12), f"expected GDAL 3.12 or newer, got {gdal.__version__}"
          EOF
        env:
          UMEP_USE_GDAL: "1"

      - name: Run tests (excluding slow) with GDAL backend
        run: .venv/bin/python -m pytest tests/ -m 'not slow' -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
          UMEP_USE_GDAL: "1"

  validation:
    name: Validation suite (3 sites)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # All jobs build the same crate the same way; share one cache.
          shared-key: maturin-develop
          workspaces: rust

      - name: Install dependencies
        run: uv sync --group test

      - name: Build Rust extension
        run: uv run maturin develop --release

      - name: Run validation tests (Kronenhuset, Gustav Adolfs, GVC)
        run: >
          uv run python -m pytest
          tests/validation/test_validation_kronenhuset.py
          tests/validation/test_validation_gustav_adolfs.py
          tests/validation/test_validation_gvc.py
          tests/validation/test_timeseries_plots.py
          -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  benchmarks:
    name: Benchmark regression gates (memory, hardware-stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # All jobs build the same crate the same way; share one cache.
          shared-key: maturin-develop
          workspaces: rust

      - name: Install dependencies
        run: uv sync --group test

      - name: Build Rust extension
        run: uv run maturin develop --release

      - name: Run benchmark gates
        # Only runs benchmarks that are hardware-stable: bytes-per-pixel
        # ceiling on `test_memory_benchmark.py` (bytes don't vary with CPU
        # model). All timing-based gates (perf matrix, tiling perf, GPU/CPU
        # ratio) are marked `gpu_perf_gate` and excluded — they live on the
        # maintainer's local hardware via `poe test_gpu_perf_gate`. See the
        # `gpu_perf_gate` marker docstring in pyproject.toml.
        run: uv run python -m pytest tests/benchmarks/ -m "not gpu_perf_gate" -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  test-spec:
    name: Test scientific spec/parity gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # All jobs build the same crate the same way; share one cache.
          shared-key: maturin-develop
          workspaces: rust

      - name: Install dependencies
        run: uv sync --group test

      - name: Build Rust extension
        run: uv run maturin develop --release

      - name: Verify UMEP availability for parity tests
        run: uv run python -c "import umep"

      - name: Run scientific/spec suite (including slow — UMEP parity needs it)
        # Spec tests include UMEP parity, anisotropic pipeline E2E, and the
        # shape-validation regression test. Slow ones must run in CI to keep
        # parity meaningful; otherwise drift sneaks through the fast gate.
        run: uv run python -m pytest tests/spec -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  test-slow:
    name: Slow integration and golden tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # All jobs build the same crate the same way; share one cache.
          shared-key: maturin-develop
          workspaces: rust

      - name: Install dependencies
        run: uv sync --group test

      - name: Build Rust extension
        run: uv run maturin develop --release

      - name: Run slow tests outside spec, validation and benchmarks
        # The fast `test` job runs `-m 'not slow'`. This job runs every
        # slow-marked test that no other job collects: the top-level files
        # and tests/golden (the SVF, GVF and wall-geometry goldens are
        # slow-marked). tests/spec, tests/validation and tests/benchmarks
        # have their own jobs. Selecting by directory rather than by file
        # list means a new slow test file cannot be left out by omission.
        run: |
          uv run python -m pytest tests \
            --ignore=tests/spec \
            --ignore=tests/validation \
            --ignore=tests/benchmarks \
            -m slow -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  audit:
    name: Repository audit (informational)
    runs-on: ubuntu-latest
    # NOT a required gate today — produces AUDIT.md as a CI artifact so
    # drift over time is visible without forcing every warning to block PRs.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # All jobs build the same crate the same way; share one cache.
          shared-key: maturin-develop
          workspaces: rust

      - name: Install dev + test dependencies
        run: uv sync --group test --group dev

      - name: Build Rust extension
        run: uv run maturin develop --release

      - name: Run audit
        run: uv run poe audit

      - name: Upload AUDIT.md
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: AUDIT.md

      - name: Show audit summary in CI log
        run: head -25 AUDIT.md
