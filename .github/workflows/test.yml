name: Test

on:
  push:
    branches:
      - main
      - dev
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - main
      - dev
  workflow_call: # Allow publish workflow to call this as a dependency

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff check
        run: uv run ruff check

      - name: Run ruff format check
        run: uv run ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ty
        run: uv run ty check pysrc/ tests/ demos/ scripts/ qgis_plugin/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: uv sync --group test

      - name: Build Rust extension
        run: uv run maturin develop --release

      - name: Run tests (excluding slow)
        run: uv run python -m pytest tests/ -m 'not slow' -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  test-qgis-compat:
    name: Test QGIS compatibility (NumPy 1.26)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install GDAL system libraries
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev gdal-bin python3-gdal

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (QGIS compat - NumPy 1.26)
        run: uv sync --group qgis-compat

      - name: Install GDAL Python bindings matching system
        run: uv pip install --no-build-isolation "gdal==$(gdal-config --version)"

      - name: Build Rust extension
        run: uv run maturin develop --release

      - name: Verify NumPy version
        run: uv run python -c "import numpy; assert numpy.__version__.startswith('1.26'), f'Expected NumPy 1.26.x, got {numpy.__version__}'"

      - name: Verify GDAL backend is used
        run: uv run python -c "from solweig import io; assert io.GDAL_ENV, 'Expected GDAL backend'"
        env:
          UMEP_USE_GDAL: "1"

      - name: Run tests (excluding slow) with GDAL backend
        run: uv run python -m pytest tests/ -m 'not slow' -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
          UMEP_USE_GDAL: "1"

  validation:
    name: Validation suite (3 sites)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: uv sync --group test

      - name: Build Rust extension
        run: uv run maturin develop --release

      - name: Run validation tests (Kronenhuset, Gustav Adolfs, GVC)
        run: >
          uv run python -m pytest
          tests/validation/test_validation_kronenhuset.py
          tests/validation/test_validation_gustav_adolfs.py
          tests/validation/test_validation_gvc.py
          tests/validation/test_timeseries_plots.py
          -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  benchmarks:
    name: Benchmark regression gates (memory + perf matrix)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: uv sync --group test

      - name: Build Rust extension
        run: uv run maturin develop --release

      - name: Run benchmark gates
        # Strict gates from tests/benchmarks/: bytes-per-pixel ceiling, per-scenario
        # absolute runtime budgets, anisotropic-over-isotropic ratios, tiled-over-
        # non-tiled ratios, plugin-over-API ratios. PERF_BUDGET_SCALE accommodates
        # shared-runner variance — increase if CI becomes flaky.
        run: uv run python -m pytest tests/benchmarks/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
          SOLWEIG_PERF_BUDGET_SCALE: "2.0"

  test-spec:
    name: Test scientific spec/parity gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: uv sync --group test

      - name: Build Rust extension
        run: uv run maturin develop --release

      - name: Verify UMEP availability for parity tests
        run: uv run python -c "import umep"

      - name: Run scientific/spec suite (including slow — UMEP parity needs it)
        # Spec tests include UMEP parity, anisotropic pipeline E2E, and the
        # shape-validation regression test. Slow ones must run in CI to keep
        # parity meaningful; otherwise drift sneaks through the fast gate.
        run: uv run python -m pytest tests/spec -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  test-slow:
    name: Slow integration tests (top-level)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: uv sync --group test

      - name: Build Rust extension
        run: uv run maturin develop --release

      - name: Run slow top-level tests
        # The fast `test` job runs `-m 'not slow'`. This job picks up the
        # slow ones outside tests/spec, tests/golden, tests/validation and
        # tests/benchmarks (which have their own jobs) — that's `test_api`,
        # `test_cache_lifecycle`, `test_svf_bundle`, `test_timeseries`,
        # `test_tiling_integration`, `test_qgis_surface_preprocessing_e2e`.
        run: |
          uv run python -m pytest \
            tests/test_api.py \
            tests/test_cache_lifecycle.py \
            tests/test_svf_bundle.py \
            tests/test_timeseries.py \
            tests/test_tiling_integration.py \
            tests/test_qgis_surface_preprocessing_e2e.py \
            -m slow -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  audit:
    name: Repository audit (informational)
    runs-on: ubuntu-latest
    # NOT a required gate today — produces AUDIT.md as a CI artifact so
    # drift over time is visible without forcing every warning to block PRs.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dev + test dependencies
        run: uv sync --group test --group dev

      - name: Build Rust extension
        run: uv run maturin develop --release

      - name: Run audit
        run: uv run poe audit

      - name: Upload AUDIT.md
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: AUDIT.md

      - name: Show audit summary in CI log
        run: head -25 AUDIT.md
